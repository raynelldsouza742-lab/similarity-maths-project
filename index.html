
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Height Comparison Tool</title>
  <link rel="stylesheet" href="height.css">
</head>

<body>
  <div class="big-container">
  <div class="container">
  <h1 id="myH1">
    Height Comparison & Conversion Tool</h1>
    <h4>Convert your height in metres to centimetres, millimetres, killometres, feet and more!</h4>
    <input id="height-input" class="heightinput"
    placeholder="Please enter your height in metres:"
    type="text">
    <p></p>
    <button id="mySubmit" class="mysubmit">Submit</button>
    <div class="conversions">
    <p class="pp">centimetres to metres: /100</p>
    <p class="pp">Feet to metres: /3.281</p>
    <p class="pp">Inches to metres: /39.37</p>
    <p class="pp">Millimetres to metres: /1000</p>
    <p class="pp2" id="myH3"></p>
    <p class="pp2" id="cm"></p>
    <p class="pp2" id="feet"></p>
    <p class="pp2" id="km"></p>
    <p class="pp2" id="mm"></p>
    </div>
    </div>

    <div class="comparisons">
      <h2></h2>
      <p class="pp3" id="mount-everest"></p>
      <p class="pp3" id="burj-khalifa"></p>
      <p class="pp3" id="eifell-tower"></p>
      <p class="pp3" id="silverback-gorilla"></p>
      <p class="pp3" id="giraffe"></p>
      <p class="pp3" id="giza"></p>
      <p class="pp3" id="german-shepherd"></p>
      <p class="pp3" id="robertwadlow"></p>
      <p class="pp3" id="chandra"></p>
      <p class="pp3" id="sultan"></p>

      <p class="pp3" id="Kunwar"></p>
      <img id ="kunwar2"></img>
    </div>
    </div>
  <script src="height.js"></script>
</body>
</html>
